name: Deploy learning site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "questions/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate source-link normalization
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("hooks/normalize_source_links.py")
          spec = importlib.util.spec_from_file_location("normalize_source_links", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          sample = """## 来源

          - OpenAI Agents SDK Tools：模型提出工具调用
            - https://openai.github.io/openai-agents-python/tools/

          ## 核心结论
          """
          rendered = module.on_page_markdown(sample)
          assert "[查看原文](https://openai.github.io/openai-agents-python/tools/)" in rendered
          assert "\n  - https://" not in rendered
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
