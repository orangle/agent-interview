name: Migrate diagrams to Mermaid

on:
  push:
    branches:
      - main
    paths:
      - "scripts/add_mermaid_diagrams.py"
      - "scripts/run_mermaid_migration.py"
      - "scripts/remove_redundant_ascii_diagrams.py"
      - ".github/workflows/mermaid-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mermaid-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Migrate diagrams
        run: python scripts/run_mermaid_migration.py

      - name: Remove redundant ASCII diagrams
        run: python scripts/remove_redundant_ascii_diagrams.py

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate MkDocs build
        run: mkdocs build --strict

      - name: Commit generated Mermaid diagrams
        run: |
          if git diff --quiet; then
            echo "No diagram changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions mkdocs.yml
          git commit -m "replace ASCII diagrams with Mermaid visualizations"
          git push
